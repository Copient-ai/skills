name: test

on:
  push:
  pull_request:
  # The portability jobs are the only check on the macOS shims, and nothing in
  # this repo changes often enough to rely on a push to exercise them.
  workflow_dispatch:

jobs:
  parser:
    # The portability shims in codex-review.sh (an ESC byte for BSD sed, a
    # gtimeout fallback, a tac-free trim) exist for macOS and are the reason
    # this runs on both. macos-latest also gives BSD awk/sed/tr and grep's
    # binary-file behaviour, which the NUL-byte fixture depends on.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Report the shell in use
        run: bash --version | head -1
      - name: Parser regression suite (no Codex call needed)
        run: bash skills/codex-review-loop/scripts/test-codex-review.sh

  bash32:
    # macos-latest ships bash 5 via the runner image, so the matrix above does
    # NOT exercise the stock /bin/bash 3.2 a real Mac has. Pin to it explicitly.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Confirm this really is bash 3.2
        run: /bin/bash --version | head -1
      - name: Parser regression suite under stock macOS bash
        run: /bin/bash skills/codex-review-loop/scripts/test-codex-review.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck --severity=warning skills/codex-review-loop/scripts/*.sh

  review-loop-config:
    # adversarial-review's own regression suite, plus its lint pass
    # (shellcheck over both skills' scripts and a Python compile check) —
    # sourced straight from .review-loop.json's "test" and "lint" commands
    # (the same file codex-review-loop/pr-review-loop read at runtime to
    # find this project's own checks), instead of retyping those command
    # strings here, so this workflow and that config file can never drift
    # apart.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run .review-loop.json's "test" command
        run: python3 -c "import json,subprocess,sys; sys.exit(subprocess.call(json.load(open('.review-loop.json'))['test'], shell=True))"
      - name: Run .review-loop.json's "lint" command
        run: python3 -c "import json,subprocess,sys; sys.exit(subprocess.call(json.load(open('.review-loop.json'))['lint'], shell=True))"
